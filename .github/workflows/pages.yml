# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Builds the Jekyll site and deploys it to Cloudflare Pages, where
# Cloudflare Access restricts who can view it. Running this from main
# updates the production site; running it from any other branch publishes
# a preview at <branch>.<project>.pages.dev behind the same login.
#
# Requires:
#   secrets.CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CLOUDFLARE_PAGES_PROJECT  Pages project name (default: corsa-dashboard)
#   vars.SITE_BASEURL              path the site is served under ("" for a
#                                  subdomain root such as dashboard.corsa.center)
name: Deploy site to Cloudflare Pages

on:
  # Runs on pushes targeting the default branch
  #push:
  #  branches: ["main"]
  #  paths-ignore:
  #    - '.github/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment per branch, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ vars.SITE_BASEURL }}"
        env:
          JEKYLL_ENV: production
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT || 'corsa-dashboard' }}"
            --branch="${{ github.ref_name }}"
            --commit-hash="${{ github.sha }}"
            --commit-dirty=true
