name: Run data update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # Run daily at 2:00 AM UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.DEPLOY_BRANCH }}
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: pip install -r _explore/scripts/requirements.txt

      - name: Setup Spack # Spack is not yet pip installable, so we must install via the actions
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: v1.1.1
          buildcache: false
          color: false
          spack_path: spack

      - name: Download sustainability metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo corsa-center/metrics \
            --workflow collect-and-sync.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::warning::No successful metrics run found in corsa-center/metrics — skipping"
            exit 0
          fi

          GENERATED_AT=$(gh run view "$RUN_ID" --repo corsa-center/metrics --json createdAt --jq .createdAt)

          STAGING=$(mktemp -d)
          echo "Downloading sustainability-metrics artifact from run $RUN_ID (generated $GENERATED_AT)"
          gh run download "$RUN_ID" \
            --repo corsa-center/metrics \
            --name sustainability-metrics \
            --dir "$STAGING"

          # Only replace the packages this artifact actually contains. It can
          # cover a subset of all tracked packages -- e.g. a manual debug run
          # scoped with --software, or collect-and-sync.yml's own job timeout
          # cutting a full run short before every package finishes -- so a
          # blanket delete-then-replace here would silently wipe good,
          # already-published data for every package the run didn't get to.
          echo "Packages updated:"
          shopt -s nullglob
          for pkg_dir in "$STAGING"/*-metrics/; do
            pkg_name=$(basename "$pkg_dir")
            # Stamp with the source run's own creation time rather than "now"
            # -- that's when this data was actually produced, which is what
            # the dashboard's "last updated" display should reflect even if
            # this daily job runs on a day the metrics pipeline didn't.
            jq -a --arg t "$GENERATED_AT" '.generated_at = $t' \
              "$pkg_dir/metrics.json" > "$pkg_dir/metrics.json.tmp" \
              && mv "$pkg_dir/metrics.json.tmp" "$pkg_dir/metrics.json"
            rm -rf "explore/github-data/$pkg_name"
            cp -r "$pkg_dir" "explore/github-data/$pkg_name"
            echo "  $pkg_name"
          done
          rm -rf "$STAGING"

      - name: Run update script
        run:
          ./_explore/scripts/UPDATE.sh
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check-changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Ran collection scripts [AUTO-GENERATED]"

      - name: Push directly to deploy branch
        if: steps.check-changes.outputs.has-changes == 'true'
        run: git push origin "HEAD:$DEPLOY_BRANCH"
