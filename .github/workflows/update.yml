name: Run data update

on:
  workflow_dispatch:
  schedule:
    # After metrics_data's 12:30 UTC "Generate Dashboard Data" run.
    - cron: "30 13 * * *"

permissions:
  contents: write
  actions: write  # needed to dispatch pages.yml after pushing new data

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.DEPLOY_BRANCH }}
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: pip install -r _explore/scripts/requirements.txt

      # Repository, dependency and Spack data, and each package's
      # sustainability metrics, come from corsa-center/metrics_data: its
      # collection runs commit metrics into data/YYYYMMDD/, and its 12:30
      # UTC "Generate Dashboard Data" run adds intReposInfo.json,
      # intRepos_Dependencies.json and the two Spack files beside them.
      # metrics_data is private, so this needs a token that can read it.
      - name: Check out metrics_data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: corsa-center/metrics_data
          token: ${{ secrets.METRICS_DATA_TOKEN }}
          path: .metrics_data

      - name: Copy data from metrics_data
        run: |
          SRC=.metrics_data/data

          # The newest day the generator has run for.
          LATEST=$(ls -d "$SRC"/[0-9]*/intReposInfo.json 2>/dev/null | sort | tail -1 | xargs -r dirname)
          if [ -z "$LATEST" ]; then
            echo "::error::No generated dashboard data in corsa-center/metrics_data"
            exit 1
          fi
          LATEST_DAY=$(basename "$LATEST")
          if [[ "$LATEST_DAY" < "$(date -u -d '2 days ago' +%Y%m%d)" ]]; then
            echo "::warning::Newest generated dashboard data is from $LATEST_DAY"
          fi
          for f in intReposInfo.json intRepos_Dependencies.json spackPackageDependencies.json spackPackageDependents.json; do
            cp "$LATEST/$f" "explore/github-data/$f"
          done
          echo "Repository data from $LATEST_DAY"

          # Collection runs in batches, so one day's directory can be
          # partial: give each package its newest metrics from the last
          # week, applying days oldest first.
          CUTOFF=$(date -u -d '7 days ago' +%Y%m%d)
          shopt -s nullglob
          for day_dir in $(ls -d "$SRC"/[0-9]*/ | sort); do
            day=$(basename "$day_dir")
            [[ "$day" < "$CUTOFF" ]] && continue
            for pkg_dir in "$day_dir"*-metrics/; do
              pkg_name=$(basename "$pkg_dir")
              rm -rf "explore/github-data/$pkg_name"
              cp -r "$pkg_dir" "explore/github-data/$pkg_name"
              # Collected before the collector wrote generated_at itself.
              jq -a --arg t "${day:0:4}-${day:4:2}-${day:6:2}T00:00:00Z" '.generated_at //= $t' \
                "explore/github-data/$pkg_name/metrics.json" > metrics.json.tmp \
                && mv metrics.json.tmp "explore/github-data/$pkg_name/metrics.json"
            done
          done

          # Keep the checkout out of the commit below.
          rm -rf .metrics_data

      - name: Run update script
        run:
          ./_explore/scripts/UPDATE.sh
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check-changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Ran collection scripts [AUTO-GENERATED]"

      - name: Push directly to deploy branch
        if: steps.check-changes.outputs.has-changes == 'true'
        run: git push origin "HEAD:$DEPLOY_BRANCH"

      #- name: Trigger Pages deployment
      #  if: steps.check-changes.outputs.has-changes == 'true'
      #  env:
      #    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  run: |
          # A push made with the automatic GITHUB_TOKEN doesn't fire other
          # workflows' `push` triggers (GitHub's anti-recursion guard), so
          # pages.yml never redeploys from this commit on its own --
          # dispatch it explicitly instead.
       #   gh workflow run pages.yml --repo "${{ github.repository }}" --ref "$DEPLOY_BRANCH"
